name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The suites are pure logic and never start Electron, so skip the
      # postinstall that would pull ~230 MB of runtime for nothing.
      - run: npm ci --ignore-scripts
      - run: npm test

  launch:
    name: launch / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Full install here: this job needs the real Electron binary.
      - run: npm ci

      # Linux runners have no display; Electron needs one to open a window.
      - name: Boot the app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.js

      - name: Boot the app
        if: runner.os != 'Linux'
        run: node scripts/smoke.js
