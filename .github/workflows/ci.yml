name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The suites are pure logic and never start Electron, so skip the
      # postinstall that would pull ~230 MB of runtime for nothing.
      - run: npm ci --ignore-scripts
      - run: npm test

  launch:
    name: launch / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Full install here: this job needs the real Electron binary.
      - run: npm ci

      # Linux runners have no display; Electron needs one to open a window.
      - name: Boot the app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.js

      - name: Boot the app
        if: runner.os != 'Linux'
        run: node scripts/smoke.js

      # Closing every note behaves differently per platform, and a boot test
      # cannot see it: macOS keeps the app alive, everywhere else it must quit
      # rather than linger with no window and no way back.
      - name: Window lifecycle (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.js --lifecycle

      - name: Window lifecycle
        if: runner.os != 'Linux'
        run: node scripts/smoke.js --lifecycle

      # The unit suites cannot see CodeMirror; this checks that live preview
      # actually rendered on this platform.
      - name: Live preview renders (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/render-check.js

      - name: Live preview renders
        if: runner.os != 'Linux'
        run: node scripts/render-check.js

      # A note longer than the screen must still be photographed whole.
      - name: Full-note capture (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/snapshot-check.js

      - name: Full-note capture
        if: runner.os != 'Linux'
        run: node scripts/snapshot-check.js

      # Autocomplete UI, driven with a stubbed model so Ollama is not needed.
      - name: Autocomplete suggestions (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/ghost-check.js

      - name: Autocomplete suggestions
        if: runner.os != 'Linux'
        run: node scripts/ghost-check.js

      # The conflict banner shipped broken twice in an afternoon, invisibly to
      # every other check: a computed style is not something the unit suites
      # can see.
      - name: Conflict banner (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/conflict-check.js

      - name: Conflict banner
        if: runner.os != 'Linux'
        run: node scripts/conflict-check.js

      # What a user actually installs, which nothing else here exercises: a
      # checkout runs from source and a built .app is branded by
      # electron-builder, so six releases in a row shipped a Dock name or icon
      # that was wrong on other machines and right on the one that built it.
      # macOS only -- it is the only platform with a bundle to brand.
      - name: Verify the install path
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: npm run verify
